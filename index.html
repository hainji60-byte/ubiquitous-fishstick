<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Redirect Page</title>
    
    <!-- 1. Facebook Open Graph Tags (Yeh Facebook par image show karne ke liye hain) -->
    <meta property="og:title" content="See More">
    <meta property="og:description" content="10 Millon Views">
    <meta property="og:image" content="https://i.postimg.cc/dQbhjWCf/play-image-1786191628542.jpg">
    <meta property="og:url" content="https://www.profitableratecpmnetwork.com/cq4tvmq1r?key=4fb8f9b4df70737c65c17f20a2cb9ee0/">
    <meta property="og:type" content="website">

    <!-- 2. Auto Redirect Script (Jaise hi koi click karke aayega, seedha target website par chala jayega) -->
    <script>
        window.location.replace("https://www.profitableratecpmnetwork.com/cq4tvmq1r?key=4fb8f9b4df70737c65c17f20a2cb9ee0/");
    </script>
</head>
<body>

    <!-- 3. Web page ya App par kholne par yeh tasveer show hogi aur click karne par redirect hogi -->
    <div style="text-align: center; margin-top: 20vh;">
        <a href="https://www.profitableratecpmnetwork.com/cq4tvmq1r?key=4fb8f9b4df70737c65c17f20a2cb9ee0/">
            <img src="https://i.postimg.cc/dQbhjWCf/play-image-1786191628542.jpg" alt="Image" style="max-width: 100%; height: auto; border-radius: 8px; cursor: pointer;">
        </a>
    </div>

</body>
</html>
